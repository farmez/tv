<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accueil</title>
<style>
  /* ------------------------------------------------------------------
     Samsung UE43TU7002 - SoC Kant-SU2 BASIC, le plus faible du chassis.
     Regles tenues partout :
       - jamais de backdrop-filter ni de blur plein ecran
       - on n'anime que transform et opacity (composes par le GPU)
       - pas d'ombre animee, pas de reflow pendant la navigation
     ------------------------------------------------------------------ */
  :root {
    --marge: 3.6vw;
    --focus: #ffffff;
    --texte: rgba(255,255,255,.97);
    --faible: rgba(255,255,255,.58);
    --surface: rgba(255,255,255,.07);
    --bord: rgba(255,255,255,.12);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #070910; color: var(--texte);
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    cursor: none;
  }

  /* ---------- fond : deux calques en fondu croise ---------- */
  #fonds { position: fixed; inset: 0; z-index: 0; background: #070910; }
  .fond { position: absolute; inset: 0; opacity: 0;
          transition: opacity 2.2s ease-in-out; transform: translateZ(0); }
  .fond.actif { opacity: 1; }
  .fond svg { width: 100%; height: 100%; display: block; }
  .fond .kb { width: 100%; height: 100%; transform-origin: 50% 50%;
              animation: kb 52s ease-in-out infinite alternate; }
  @keyframes kb {
    from { transform: scale(1.00) translate3d(0,0,0); }
    to   { transform: scale(1.07) translate3d(-1%, -.6%, 0); }
  }
  #voile { position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: linear-gradient(to bottom, rgba(5,6,12,.70) 0%, rgba(5,6,12,.30) 30%,
                rgba(5,6,12,.55) 62%, rgba(5,6,12,.93) 100%); }

  #ecran { position: relative; z-index: 2; height: 100%;
           padding: var(--marge) var(--marge) 2.4vh;
           display: flex; flex-direction: column; }

  /* ---------- en-tete ---------- */
  header { display: flex; align-items: flex-start; justify-content: space-between; }
  #titre { font-size: 46px; font-weight: 300; letter-spacing: -.8px; line-height: 1; }
  #onglets { display: flex; gap: 30px; margin-top: 16px;
             font-size: 19px; color: var(--faible); }
  #onglets .actif { color: var(--texte); }
  #coin { text-align: right; }
  #heure { font-size: 38px; font-weight: 200; letter-spacing: -.5px; line-height: 1; }
  #date { font-size: 16px; color: var(--faible); margin-top: 7px; text-transform: capitalize; }

  /* ---------- bandeau de contenu ---------- */
  #contenu { flex: 1; display: flex; align-items: center; }
  .piste { overflow: hidden; padding: 26px 0 26px 22px; margin: 0 0 0 -22px; width: 100%; }
  #cartes { display: flex; gap: 20px; align-items: flex-start;
            transition: transform .34s cubic-bezier(.22,.61,.36,1); }

  .carte { flex: 0 0 auto; position: relative; transform: translateZ(0);
           transition: transform .22s cubic-bezier(.22,.61,.36,1); }
  .carte .vignette {
    position: relative; overflow: hidden; border-radius: 12px;
    border: 1px solid var(--bord);
    transition: box-shadow .22s ease, border-color .22s ease;
  }
  .carte.grande .vignette { width: 660px; height: 372px; }
  .carte.petite .vignette { width: 236px; height: 332px; }
  .carte .vignette svg { width: 100%; height: 100%; display: block; }
  .carte .nom { margin-top: 13px; font-size: 21px; font-weight: 400;
                white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .carte.petite .nom { font-size: 18px; max-width: 236px; }
  .carte .meta { margin-top: 5px; font-size: 15px; color: var(--faible);
                 white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .carte.petite .meta { max-width: 236px; }
  .carte.vis { transform: scale(1.035) translateZ(0); }
  .carte.vis .vignette { border-color: var(--focus);
    box-shadow: 0 0 0 3px var(--focus), 0 20px 46px rgba(0,0,0,.6); }

  /* ---------- dock ---------- */
  #dock-zone { padding-top: 10px; }
  .piste-dock { overflow: hidden; padding: 20px 0 14px 20px; margin: 0 0 0 -20px; }
  #dock { display: flex; gap: 18px; align-items: center;
          transition: transform .34s cubic-bezier(.22,.61,.36,1); }
  .app {
    flex: 0 0 auto; width: 158px; height: 88px; border-radius: 13px;
    background: var(--surface); border: 1px solid var(--bord);
    position: relative; overflow: hidden; transform: translateZ(0);
    transition: transform .2s cubic-bezier(.22,.61,.36,1), box-shadow .2s ease, border-color .2s ease;
  }
  .app .fondu { position: absolute; inset: 0; opacity: .9; }
  .app img { position: absolute; top: 50%; left: 50%; width: 64px; height: 64px;
             transform: translate(-50%,-50%); border-radius: 11px; }
  .app .lettre { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
                 font-size: 34px; font-weight: 300; }
  .app .etiq { position: absolute; left: 0; right: 0; bottom: 7px; text-align: center;
               font-size: 13px; color: rgba(255,255,255,.9); padding: 0 8px;
               white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
               text-shadow: 0 1px 3px rgba(0,0,0,.7); }
  .app.vis { transform: scale(1.09) translateZ(0); border-color: var(--focus);
             box-shadow: 0 0 0 3px var(--focus), 0 14px 32px rgba(0,0,0,.55); }

  /* ---------- panneau favoris ---------- */
  #reglages { position: fixed; inset: 0; z-index: 10; background: #05070c;
              display: none; flex-direction: column; padding: var(--marge); }
  #reglages.ouvert { display: flex; }
  #reglages h2 { font-size: 34px; font-weight: 300; margin-bottom: 5px; }
  #reglages .aide { color: var(--faible); font-size: 18px; margin-bottom: 22px; }
  #diag { font-family: ui-monospace, Consolas, monospace; font-size: 15px; line-height: 1.5;
          color: #9fe0b0; background: rgba(255,255,255,.05); border: 1px solid var(--bord);
          border-radius: 8px; padding: 12px 16px; margin-bottom: 18px;
          white-space: pre-wrap; max-height: 30vh; overflow: hidden; }
  #liste { flex: 1; overflow: hidden; }
  #liste-inner { transition: transform .28s cubic-bezier(.22,.61,.36,1); }
  .ligne { display: flex; align-items: center; gap: 16px; padding: 12px 16px;
           border-radius: 9px; margin-bottom: 5px; border: 1px solid transparent; }
  .ligne.vis { background: rgba(255,255,255,.11); border-color: var(--focus); }
  .ligne .case { width: 26px; font-size: 20px; color: #ffd479; }
  .ligne .nm { flex: 1; font-size: 21px; }
  .ligne .id { color: var(--faible); font-size: 14px; font-family: ui-monospace, Consolas, monospace; }

  #toast { position: fixed; left: 50%; bottom: 6vh; z-index: 20;
           transform: translate(-50%,16px); opacity: 0;
           background: rgba(12,14,20,.95); border: 1px solid rgba(255,255,255,.15);
           padding: 14px 26px; border-radius: 9px; font-size: 19px;
           transition: opacity .22s ease, transform .22s ease;
           max-width: 70vw; text-align: center; }
  #toast.vu { opacity: 1; transform: translate(-50%,0); }
</style>
</head>
<body>

<div id="fonds"></div>
<div id="voile"></div>

<div id="ecran">
  <header>
    <div>
      <div id="titre">Pour vous</div>
      <div id="onglets"><span class="actif">Explorer</span><span>Films</span><span>Series</span></div>
    </div>
    <div id="coin">
      <div id="heure">--:--</div>
      <div id="date">&nbsp;</div>
    </div>
  </header>

  <div id="contenu">
    <div class="piste"><div id="cartes"></div></div>
  </div>

  <div id="dock-zone">
    <div class="piste-dock"><div id="dock"></div></div>
  </div>
</div>

<div id="reglages">
  <h2>Choisir les applications du dock</h2>
  <div class="aide">Haut / Bas pour parcourir &middot; OK pour ajouter ou retirer &middot; Retour pour fermer</div>
  <pre id="diag"></pre>
  <div id="liste"><div id="liste-inner"></div></div>
</div>

<div id="toast"></div>

<script>
"use strict";

/* ===================================================================
   1. Decors de fond, en SVG vectoriel.
      Choix assume : une photo 4K couterait un decodage que ce SoC n'a
      pas a offrir. Ces scenes pesent quelques Ko et montent en GPU.
   =================================================================== */
var DECORS = [
  '<svg viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">' +
  '<defs><linearGradient id="f1" x1="0" y1="0" x2="0" y2="1">' +
  '<stop offset="0%" stop-color="#060d1e"/><stop offset="50%" stop-color="#0b2440"/><stop offset="100%" stop-color="#06131f"/></linearGradient>' +
  '<linearGradient id="f2" x1="0" y1="0" x2="1" y2="0">' +
  '<stop offset="5%" stop-color="#2ad17f" stop-opacity="0"/><stop offset="40%" stop-color="#2ad17f" stop-opacity=".40"/>' +
  '<stop offset="70%" stop-color="#6ee7c8" stop-opacity=".28"/><stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/></linearGradient></defs>' +
  '<rect width="1920" height="1080" fill="url(#f1)"/>' +
  '<circle cx="340" cy="140" r="1.5" fill="#fff" opacity=".8"/><circle cx="700" cy="88" r="1.2" fill="#fff" opacity=".6"/>' +
  '<circle cx="1240" cy="124" r="1.6" fill="#fff" opacity=".75"/><circle cx="1620" cy="76" r="1.3" fill="#fff" opacity=".55"/>' +
  '<path d="M-60,320 C280,170 640,410 1000,250 C1320,110 1640,320 1990,190 L1990,510 C1600,610 1240,420 960,510 C640,610 280,470 -60,570 Z" fill="url(#f2)"/>' +
  '<path d="M0,770 L260,610 L430,710 L650,550 L870,720 L1070,630 L1310,770 L1530,650 L1760,790 L1920,700 L1920,1080 L0,1080 Z" fill="#050e1c"/>' +
  '<path d="M0,890 L310,790 L570,880 L830,770 L1090,890 L1370,800 L1660,910 L1920,830 L1920,1080 L0,1080 Z" fill="#030810"/></svg>',

  '<svg viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">' +
  '<defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">' +
  '<stop offset="0%" stop-color="#171331"/><stop offset="42%" stop-color="#53305c"/>' +
  '<stop offset="72%" stop-color="#a9566a"/><stop offset="100%" stop-color="#d98a63"/></linearGradient>' +
  '<radialGradient id="g2" cx="50%" cy="50%" r="50%">' +
  '<stop offset="0%" stop-color="#ffeccd" stop-opacity=".85"/><stop offset="100%" stop-color="#ffbe84" stop-opacity="0"/></radialGradient></defs>' +
  '<rect width="1920" height="1080" fill="url(#g1)"/>' +
  '<circle cx="1210" cy="640" r="300" fill="url(#g2)"/><circle cx="1210" cy="640" r="52" fill="#fff4e0" opacity=".92"/>' +
  '<path d="M0,690 L300,510 L480,610 L710,470 L910,600 L1160,500 L1410,630 L1660,540 L1920,650 L1920,1080 L0,1080 Z" fill="#4d3d52" opacity=".9"/>' +
  '<path d="M0,790 L240,680 L540,780 L800,670 L1040,790 L1340,690 L1620,800 L1920,720 L1920,1080 L0,1080 Z" fill="#332940" opacity=".92"/>' +
  '<path d="M0,900 L350,820 L670,900 L990,830 L1310,905 L1630,840 L1920,900 L1920,1080 L0,1080 Z" fill="#1d1728"/></svg>',

  '<svg viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">' +
  '<defs><linearGradient id="h1" x1="0" y1="0" x2="0" y2="1">' +
  '<stop offset="0%" stop-color="#8ea7a1"/><stop offset="45%" stop-color="#5f7a76"/><stop offset="100%" stop-color="#22352f"/></linearGradient>' +
  '<linearGradient id="h2" x1="0" y1="0" x2="0" y2="1">' +
  '<stop offset="0%" stop-color="#c8d6d2" stop-opacity=".34"/><stop offset="100%" stop-color="#c8d6d2" stop-opacity="0"/></linearGradient></defs>' +
  '<rect width="1920" height="1080" fill="url(#h1)"/>' +
  '<g fill="#50706a" opacity=".5">' +
  '<path d="M130,770 l52,-240 l52,240 Z"/><path d="M350,795 l46,-220 l46,220 Z"/><path d="M580,760 l56,-260 l56,260 Z"/>' +
  '<path d="M840,800 l48,-225 l48,225 Z"/><path d="M1100,765 l54,-255 l54,255 Z"/><path d="M1360,795 l48,-230 l48,230 Z"/>' +
  '<path d="M1620,770 l53,-250 l53,250 Z"/></g>' +
  '<rect x="0" y="700" width="1920" height="190" fill="url(#h2)"/>' +
  '<g fill="#2e4641" opacity=".8">' +
  '<path d="M50,905 l64,-290 l64,290 Z"/><path d="M300,935 l58,-270 l58,270 Z"/><path d="M580,895 l68,-310 l68,310 Z"/>' +
  '<path d="M870,940 l60,-275 l60,275 Z"/><path d="M1160,900 l66,-300 l66,300 Z"/><path d="M1450,935 l58,-280 l58,280 Z"/>' +
  '<path d="M1730,905 l64,-290 l64,290 Z"/></g>' +
  '<g fill="#16241f">' +
  '<path d="M-20,1080 l82,-350 l82,350 Z"/><path d="M260,1080 l76,-320 l76,320 Z"/><path d="M550,1080 l86,-370 l86,370 Z"/>' +
  '<path d="M850,1080 l78,-330 l78,330 Z"/><path d="M1160,1080 l84,-360 l84,360 Z"/><path d="M1470,1080 l76,-325 l76,325 Z"/>' +
  '<path d="M1770,1080 l82,-345 l82,345 Z"/></g></svg>'
];

/* Visuels de contenu : compositions abstraites generees, sans reseau.
   Chaque entree reçoit une palette et une geometrie differentes. */
var PALETTES = [
  ['#1b2a5e','#4a2d73','#c0455f'], ['#0f3b3a','#1d6b5e','#d4a03c'],
  ['#3b1230','#7a2347','#e0633f'], ['#111d3a','#2b4a7a','#6fb3d2'],
  ['#2a1407','#7a3a14','#d98b3a'], ['#13233a','#355070','#b56576']
];

function visuel(i, w, h) {
  var p = PALETTES[i % PALETTES.length];
  var id = 'v' + i;
  return '<svg viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">' +
    '<defs><linearGradient id="' + id + '" x1="0" y1="0" x2="1" y2="1">' +
    '<stop offset="0%" stop-color="' + p[0] + '"/><stop offset="55%" stop-color="' + p[1] + '"/>' +
    '<stop offset="100%" stop-color="' + p[2] + '"/></linearGradient>' +
    '<radialGradient id="' + id + 'r" cx="30%" cy="25%" r="70%">' +
    '<stop offset="0%" stop-color="#ffffff" stop-opacity=".22"/><stop offset="100%" stop-color="#ffffff" stop-opacity="0"/></radialGradient></defs>' +
    '<rect width="' + w + '" height="' + h + '" fill="url(#' + id + ')"/>' +
    '<rect width="' + w + '" height="' + h + '" fill="url(#' + id + 'r)"/>' +
    '<circle cx="' + (w * 0.74) + '" cy="' + (h * 0.30) + '" r="' + (h * 0.20) + '" fill="#fff" opacity=".10"/>' +
    '<path d="M0,' + (h * 0.78) + ' Q' + (w * 0.28) + ',' + (h * 0.60) + ' ' + (w * 0.55) + ',' + (h * 0.76) +
      ' T' + w + ',' + (h * 0.68) + ' L' + w + ',' + h + ' L0,' + h + ' Z" fill="#000" opacity=".30"/>' +
    '<path d="M0,' + (h * 0.90) + ' Q' + (w * 0.34) + ',' + (h * 0.76) + ' ' + (w * 0.64) + ',' + (h * 0.90) +
      ' T' + w + ',' + (h * 0.84) + ' L' + w + ',' + h + ' L0,' + h + ' Z" fill="#000" opacity=".42"/></svg>';
}

/* Le bandeau de contenu. Modifiable librement : c'est de la donnee. */
var CONTENU = [
  { nom: 'Grand format',   meta: 'Selection - a ouvrir avec OK' },
  { nom: 'A decouvrir',    meta: 'Suggestion' },
  { nom: 'Reprendre',      meta: 'En cours' },
  { nom: 'Ma liste',       meta: 'Enregistres' }
];

/* Repli pour l'apercu navigateur. Sur la TV, getAppsInfo() fournit la
   vraie liste et surtout les vraies icones des applis installees. */
var REPLI = [
  { id: '11101200001',   nom: 'Netflix' },
  { id: '111299001912',  nom: 'YouTube' },
  { id: '3201910019365', nom: 'Prime Video' },
  { id: '3201901017640', nom: 'Disney+' },
  { id: '3201706012478', nom: 'HBO Max' },
  { id: '3201807016597', nom: 'Apple TV' },
  { id: '3201606009684', nom: 'Spotify' },
  { id: '3201512006963', nom: 'Plex' }
];

var TEINTES = [
  ['#c92a2a','#7d1414'], ['#d93636','#8c1c1c'], ['#1098ad','#07617a'],
  ['#3b5bdb','#1c3aa9'], ['#5f3dc4','#3b2191'], ['#495057','#212529'],
  ['#2b8a3e','#13521f'], ['#e8590c','#9c3503']
];

/* ===================================================================
   2. Etat
   =================================================================== */
var surTizen = (typeof tizen !== 'undefined' && tizen && tizen.application);
var apps = [], dock = [];
var zone = 'contenu';
var iCarte = 0, iDock = 0, iListe = 0;
var reglagesOuverts = false;
var iDecor = -1, cA, cB, actif = 0;
var CLE = 'accueil.dock.v2';

function lireDock() {
  try { var b = window.localStorage.getItem(CLE); if (b) return JSON.parse(b); }
  catch (e) {}
  return null;
}
function ecrireDock() {
  try { window.localStorage.setItem(CLE, JSON.stringify(dock)); } catch (e) {}
}

/* ===================================================================
   3. Fond
   =================================================================== */
function initFonds() {
  var h = document.getElementById('fonds');
  cA = document.createElement('div'); cA.className = 'fond';
  cB = document.createElement('div'); cB.className = 'fond';
  h.appendChild(cA); h.appendChild(cB);
  decorSuivant();
  setInterval(decorSuivant, 50000);
}
function decorSuivant() {
  iDecor = (iDecor + 1) % DECORS.length;
  var cible = (actif === 0) ? cB : cA;
  var sortant = (actif === 0) ? cA : cB;
  cible.innerHTML = '<div class="kb">' + DECORS[iDecor] + '</div>';
  cible.classList.add('actif');
  sortant.classList.remove('actif');
  actif = 1 - actif;
}

/* ===================================================================
   4. Horloge - toutes les 15 s, seules les minutes sont affichees
   =================================================================== */
function majHorloge() {
  var d = new Date();
  document.getElementById('heure').textContent =
    ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
  var t;
  try { t = d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' }); }
  catch (e) { t = d.toDateString(); }
  document.getElementById('date').textContent = t;
}

/* ===================================================================
   5. Applications
   =================================================================== */
/* Journal de diagnostic, consultable depuis le panneau des reglages.
   Sert a savoir pourquoi les icones reelles n'apparaissent pas. */
var DIAG = [];
function diag(l) { DIAG.push(l); }

/* Balise de diagnostic temporaire : envoie le journal au PC de Fares pour
   qu'il soit lisible sans recopier l'ecran de la TV. A RETIRER une fois la
   cause identifiee. Echoue en silence si le PC est eteint. */
var BALISE = 'http://192.168.1.100:8100/diag';
function envoyerDiag() {
  try {
    var d = DIAG.join(' | ') + ' || UA=' + navigator.userAgent +
            ' || origine=' + location.origin + ' || href=' + location.href;
    var i = new Image();
    i.src = BALISE + '?d=' + encodeURIComponent(d.substring(0, 1800)) + '&t=' + Date.now();
  } catch (e) { /* sans consequence */ }
}

function chargerApps() {
  diag('tizen           : ' + (typeof tizen));
  if (typeof tizen !== 'undefined' && tizen) {
    var sous = [];
    for (var k in tizen) { try { sous.push(k); } catch (e) {} }
    diag('sous-API tizen  : ' + (sous.length ? sous.join(',') : '(aucune enumerable)'));
    diag('  .application  : ' + (typeof tizen.application));
    diag('  .tvinputdevice: ' + (typeof tizen.tvinputdevice));
    diag('  .filesystem   : ' + (typeof tizen.filesystem));
  }
  diag('getAppsInfo     : ' + (surTizen ? (typeof tizen.application.getAppsInfo) : 'n/a'));
  diag('launch          : ' + (surTizen ? (typeof tizen.application.launch) : 'n/a'));

  if (surTizen && typeof tizen.application.getAppsInfo === 'function') {
    try {
      tizen.application.getAppsInfo(function (l) {
        diag('getAppsInfo     : OK, ' + l.length + ' applis brutes');
        var v = [], avecIcone = 0;
        for (var i = 0; i < l.length; i++) {
          if (l[i].show === false) continue;
          var ip = l[i].iconPath || null;
          if (ip) avecIcone++;
          if (v.length < 3) diag('  ex. ' + l[i].name + ' -> iconPath=' + (ip === null ? 'NULL' : ip));
          v.push({ id: l[i].id, nom: l[i].name, icone: ip });
        }
        diag('visibles        : ' + v.length + ', dont ' + avecIcone + ' avec iconPath');
        v.sort(function (a, b) { return a.nom.localeCompare(b.nom, 'fr'); });
        apps = v.length ? v : REPLI.map(norm);
        if (!v.length) diag('--> liste vide, repli sur la liste codee en dur');
        apresApps();
      }, function (e) {
        diag('getAppsInfo     : ECHEC ' + (e && e.name ? e.name : '') + ' ' + (e && e.message ? e.message : ''));
        diag('--> repli sur la liste codee en dur (sans icones)');
        apps = REPLI.map(norm); apresApps();
      });
      return;
    } catch (e) {
      diag('getAppsInfo     : EXCEPTION ' + (e && e.message ? e.message : e));
    }
  }
  diag('--> API indisponible, repli sur la liste codee en dur (sans icones)');
  apps = REPLI.map(norm);
  apresApps();
}
function norm(x) { return { id: x.id, nom: x.nom, icone: null }; }

function apresApps() {
  var s = lireDock();
  if (s && s.length) {
    dock = s.filter(function (id) { return trouver(id) !== null; });
  } else {
    dock = apps.slice(0, Math.min(7, apps.length)).map(function (a) { return a.id; });
  }
  dessiner();
  envoyerDiag();
}
function trouver(id) {
  for (var i = 0; i < apps.length; i++) if (apps[i].id === id) return apps[i];
  return null;
}

/* ===================================================================
   6. Rendu
   =================================================================== */
function dessiner() {
  var c = document.getElementById('cartes');
  c.innerHTML = '';
  for (var i = 0; i < CONTENU.length; i++) {
    var grande = (i === 0);
    var d = document.createElement('div');
    d.className = 'carte ' + (grande ? 'grande' : 'petite');
    d.innerHTML = '<div class="vignette">' + visuel(i, grande ? 660 : 236, grande ? 372 : 332) + '</div>' +
                  '<div class="nom">' + CONTENU[i].nom + '</div>' +
                  '<div class="meta">' + CONTENU[i].meta + '</div>';
    c.appendChild(d);
  }

  var dk = document.getElementById('dock');
  dk.innerHTML = '';
  for (var j = 0; j < dock.length; j++) {
    var a = trouver(dock[j]);
    if (!a) continue;
    var t = TEINTES[apps.indexOf(a) % TEINTES.length];
    var e = document.createElement('div');
    e.className = 'app';
    var h = '<div class="fondu" style="background:linear-gradient(145deg,' + t[0] + ',' + t[1] + ')"></div>';
    if (a.icone) {
      // Premiere tentative avec le chemin tel quel ; en cas d'echec on
      // reessaie en file://, puis on retombe sur la lettre.
      h += '<img src="' + a.icone + '" alt="" data-brut="' + a.icone + '" onerror="iconeKo(this)">';
      h += '<span class="lettre" style="display:none">' + a.nom.charAt(0).toUpperCase() + '</span>';
      h += '<span class="etiq" style="display:none">' + a.nom + '</span>';
    } else {
      h += '<span class="lettre">' + a.nom.charAt(0).toUpperCase() + '</span>' +
           '<span class="etiq">' + a.nom + '</span>';
    }
    e.innerHTML = h;
    dk.appendChild(e);
  }
  // tuile de reglage en fin de dock
  var r = document.createElement('div');
  r.className = 'app';
  r.innerHTML = '<div class="fondu" style="background:linear-gradient(145deg,#2c323c,#141820)"></div>' +
                '<span class="lettre">&#9881;</span>';
  dk.appendChild(r);

  majFocus();
}

/* Repli en cascade d'une icone : chemin brut -> file:// -> lettre. */
window.iconeKo = function (img) {
  var brut = img.getAttribute('data-brut') || '';
  if (!img.getAttribute('data-essai') && brut.charAt(0) === '/') {
    img.setAttribute('data-essai', '1');
    diag('icone KO en direct, essai file:// pour ' + brut);
    img.src = 'file://' + brut;
    return;
  }
  diag('icone KO definitivement : ' + brut);
  img.style.display = 'none';
  var p = img.parentNode;
  var l = p.querySelector('.lettre'); if (l) l.style.display = '';
  var e = p.querySelector('.etiq');   if (e) e.style.display = '';
};

function lesCartes() { return document.querySelectorAll('#cartes .carte'); }
function lesApps()   { return document.querySelectorAll('#dock .app'); }

function majFocus() {
  var c = lesCartes(), a = lesApps(), i;
  for (i = 0; i < c.length; i++) c[i].classList.remove('vis');
  for (i = 0; i < a.length; i++) a[i].classList.remove('vis');

  if (zone === 'contenu' && c.length) {
    if (iCarte >= c.length) iCarte = c.length - 1;
    c[iCarte].classList.add('vis');
    var dec = 0;
    for (i = 0; i < iCarte; i++) dec += c[i].offsetWidth + 20;
    if (iCarte === 0) dec = 0;
    document.getElementById('cartes').style.transform = 'translate3d(' + (-dec) + 'px,0,0)';
  } else if (zone === 'dock' && a.length) {
    if (iDock >= a.length) iDock = a.length - 1;
    a[iDock].classList.add('vis');
    var pas = 158 + 18;
    var d2 = Math.max(0, iDock - 4) * pas;
    document.getElementById('dock').style.transform = 'translate3d(' + (-d2) + 'px,0,0)';
  }
}

/* ===================================================================
   7. Lancement
   =================================================================== */
function lancer(id) {
  var a = trouver(id);
  var nom = a ? a.nom : id;
  if (surTizen && typeof tizen.application.launch === 'function') {
    try {
      tizen.application.launch(id, function () {},
        function (e) { toast('Impossible d\'ouvrir ' + nom); });
    } catch (e) { toast('Lancement refuse pour ' + nom); }
  } else {
    toast('Apercu navigateur — sur la TV, ceci ouvrirait ' + nom);
  }
}

var tTo = null;
function toast(m) {
  var t = document.getElementById('toast');
  t.textContent = m; t.classList.add('vu');
  if (tTo) clearTimeout(tTo);
  tTo = setTimeout(function () { t.classList.remove('vu'); }, 3000);
}

/* ===================================================================
   8. Panneau du dock
   =================================================================== */
function ouvrirReglages() {
  reglagesOuverts = true; iListe = 0;
  document.getElementById('reglages').classList.add('ouvert');
  document.getElementById('diag').textContent = DIAG.join('\n');
  dessinerListe();
}
function fermerReglages() {
  reglagesOuverts = false;
  document.getElementById('reglages').classList.remove('ouvert');
  ecrireDock(); dessiner();
}
function dessinerListe() {
  var h = '';
  for (var i = 0; i < apps.length; i++) {
    var a = apps[i];
    h += '<div class="ligne' + (i === iListe ? ' vis' : '') + '">' +
         '<span class="case">' + (dock.indexOf(a.id) !== -1 ? '&#9733;' : '&#9734;') + '</span>' +
         '<span class="nm">' + a.nom + '</span>' +
         '<span class="id">' + a.id + '</span></div>';
  }
  var n = document.getElementById('liste-inner');
  n.innerHTML = h;
  var hl = 60;
  var vis = Math.floor(document.getElementById('liste').clientHeight / hl);
  n.style.transform = 'translate3d(0,' + (-Math.max(0, iListe - vis + 2) * hl) + 'px,0)';
}
function basculer() {
  var a = apps[iListe];
  if (!a) return;
  var p = dock.indexOf(a.id);
  if (p === -1) {
    if (dock.length >= 9) { toast('Dock plein (9 maximum)'); return; }
    dock.push(a.id);
  } else { dock.splice(p, 1); }
  dessinerListe();
}

/* ===================================================================
   9. Telecommande - Tizen : Retour = 10009
   =================================================================== */
function surTouche(ev) {
  var k = ev.keyCode;

  if (reglagesOuverts) {
    if (k === 38) { iListe = Math.max(0, iListe - 1); dessinerListe(); }
    else if (k === 40) { iListe = Math.min(apps.length - 1, iListe + 1); dessinerListe(); }
    else if (k === 13) { basculer(); }
    else if (k === 10009 || k === 8 || k === 27) { fermerReglages(); }
    else return;
    ev.preventDefault(); return;
  }

  if (k === 37) {
    if (zone === 'contenu') iCarte = Math.max(0, iCarte - 1);
    else iDock = Math.max(0, iDock - 1);
  } else if (k === 39) {
    if (zone === 'contenu') iCarte = Math.min(lesCartes().length - 1, iCarte + 1);
    else iDock = Math.min(lesApps().length - 1, iDock + 1);
  } else if (k === 40) {
    if (zone === 'contenu' && lesApps().length) zone = 'dock';
  } else if (k === 38) {
    if (zone === 'dock') zone = 'contenu';
  } else if (k === 13) {
    if (zone === 'dock') {
      if (iDock === dock.length) ouvrirReglages();      // tuile engrenage
      else { var a = trouver(dock[iDock]); if (a) lancer(a.id); }
    } else {
      toast(CONTENU[iCarte].nom);
    }
    ev.preventDefault(); return;
  } else if (k === 10009 || k === 8 || k === 27) {
    if (zone === 'dock') zone = 'contenu';
    else if (surTizen && tizen.application) {
      try { tizen.application.getCurrentApplication().exit(); } catch (e) {}
    }
  } else { return; }

  majFocus();
  ev.preventDefault();
}

/* ===================================================================
   10. Demarrage
   =================================================================== */
function demarrer() {
  initFonds();
  majHorloge();
  setInterval(majHorloge, 15000);
  chargerApps();
  document.addEventListener('keydown', surTouche, false);
  if (typeof tizen !== 'undefined' && tizen.tvinputdevice) {
    var ks = ['MediaPlayPause', 'MediaPlay', 'MediaPause', 'MediaStop'];
    for (var i = 0; i < ks.length; i++) {
      try { tizen.tvinputdevice.registerKey(ks[i]); } catch (e) {}
    }
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', demarrer);
} else { demarrer(); }
</script>
