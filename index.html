<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accueil</title>
<style>
  /* ------------------------------------------------------------------
     Contraintes materielles : Samsung UE43TU7002, SoC Kant-SU2 BASIC.
     On s'interdit backdrop-filter et filter:blur en plein ecran, et on
     n'anime que transform et opacity (composites par le GPU).
     ------------------------------------------------------------------ */
  :root {
    --marge: 4vw;              /* securite overscan */
    --focus: #ffffff;
    --texte: rgba(255,255,255,.96);
    --texte-faible: rgba(255,255,255,.60);
    --tuile: rgba(255,255,255,.10);
    --tuile-bord: rgba(255,255,255,.14);
    --r: 14px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #05070c;
    color: var(--texte);
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 24px;
    -webkit-font-smoothing: antialiased;
    cursor: none;
  }

  /* ---------- fonds nature : deux calques en fondu croise ---------- */
  #fonds { position: fixed; inset: 0; z-index: 0; background: #05070c; }
  .fond {
    position: absolute; inset: 0;
    opacity: 0;
    transition: opacity 2.5s ease-in-out;
    transform: translateZ(0);
  }
  .fond.actif { opacity: 1; }
  .fond svg { width: 100%; height: 100%; display: block; }
  .fond .kb {
    width: 100%; height: 100%;
    transform-origin: 50% 55%;
    animation: kenburns 48s ease-in-out infinite alternate;
  }
  @keyframes kenburns {
    from { transform: scale(1.00) translate3d(0, 0, 0); }
    to   { transform: scale(1.09) translate3d(-1.2%, -0.8%, 0); }
  }
  /* voile de lisibilite : degrade peint, pas de filtre */
  #voile {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background:
      linear-gradient(to bottom, rgba(0,0,0,.55) 0%, rgba(0,0,0,.10) 32%, rgba(0,0,0,.10) 48%, rgba(0,0,0,.78) 100%);
  }

  /* ---------- mise en page ---------- */
  #ecran {
    position: relative; z-index: 2;
    height: 100%;
    padding: var(--marge);
    display: flex; flex-direction: column;
  }

  header { display: flex; align-items: flex-start; justify-content: space-between; }
  #heure { font-size: 76px; font-weight: 200; letter-spacing: -2px; line-height: 1; }
  #date  { font-size: 22px; color: var(--texte-faible); margin-top: 10px; text-transform: capitalize; }
  #marque { font-size: 19px; color: var(--texte-faible); letter-spacing: 3px; text-transform: uppercase; }

  #milieu { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .titre-section { font-size: 17px; letter-spacing: 2.5px; text-transform: uppercase;
                   color: var(--texte-faible); margin-bottom: 18px; }

  /* ---------- rangee d'applications ---------- */
  /* La piste rogne le defilement horizontal. Elle recoit une marge interieure
     pour que l'agrandissement de la tuile visee et son halo ne soient pas
     coupes : overflow rogne au bord de la boite de padding, pas du contenu.
     La marge negative annule le decalage visuel. */
  .piste { overflow: hidden; padding: 30px 0 30px 20px; margin: -30px 0 -30px -20px; }
  #rangee { display: flex; gap: 22px; transition: transform .38s cubic-bezier(.22,.61,.36,1); }
  .tuile {
    flex: 0 0 auto;
    width: 272px; height: 153px;
    border-radius: var(--r);
    background: var(--tuile);
    border: 1px solid var(--tuile-bord);
    position: relative; overflow: hidden;
    transition: transform .22s cubic-bezier(.22,.61,.36,1), box-shadow .22s ease, border-color .22s ease;
    transform: translateZ(0);
  }
  .tuile .fondu { position: absolute; inset: 0; opacity: .92; }
  .tuile img { position: absolute; top: 50%; left: 50%; width: 76px; height: 76px;
               transform: translate(-50%, -60%); border-radius: 12px; }
  .tuile .lettre {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -62%);
    font-size: 46px; font-weight: 300; color: #fff; opacity: .95;
  }
  .tuile .nom {
    position: absolute; left: 0; right: 0; bottom: 12px; text-align: center;
    font-size: 19px; font-weight: 400; color: #fff;
    text-shadow: 0 1px 4px rgba(0,0,0,.6);
    padding: 0 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tuile.vis {
    transform: scale(1.11) translateZ(0);
    border-color: var(--focus);
    box-shadow: 0 0 0 3px var(--focus), 0 18px 40px rgba(0,0,0,.55);
    z-index: 3;
  }
  .tuile .etoile { position: absolute; top: 9px; right: 11px; font-size: 17px;
                   color: #ffd479; text-shadow: 0 1px 3px rgba(0,0,0,.7); }

  /* ---------- dock ---------- */
  #zone-dock { margin-top: 4px; }
  #dock { display: flex; gap: 20px; align-items: flex-end; }
  .fav {
    flex: 0 0 auto; width: 104px; height: 104px; border-radius: 22px;
    background: var(--tuile); border: 1px solid var(--tuile-bord);
    position: relative; overflow: hidden;
    transition: transform .22s cubic-bezier(.22,.61,.36,1), box-shadow .22s ease, border-color .22s ease;
    transform: translateZ(0);
  }
  .fav .fondu { position: absolute; inset: 0; opacity: .92; }
  .fav img { position: absolute; top: 50%; left: 50%; width: 58px; height: 58px;
             transform: translate(-50%, -50%); border-radius: 11px; }
  .fav .lettre { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -52%);
                 font-size: 38px; font-weight: 300; }
  .fav.vis {
    transform: scale(1.14) translateZ(0);
    border-color: var(--focus);
    box-shadow: 0 0 0 3px var(--focus), 0 16px 34px rgba(0,0,0,.55);
  }
  #dock-vide { color: var(--texte-faible); font-size: 20px; }

  /* ---------- panneau reglages ---------- */
  #reglages {
    position: fixed; inset: 0; z-index: 10;
    background: #04060b;
    display: none; flex-direction: column; padding: var(--marge);
  }
  #reglages.ouvert { display: flex; }
  #reglages h2 { font-size: 36px; font-weight: 300; margin-bottom: 6px; }
  #reglages p.aide { color: var(--texte-faible); font-size: 20px; margin-bottom: 26px; }
  #liste { flex: 1; overflow: hidden; }
  #liste-inner { transition: transform .3s cubic-bezier(.22,.61,.36,1); }
  .ligne {
    display: flex; align-items: center; gap: 18px;
    padding: 14px 18px; border-radius: 10px; margin-bottom: 6px;
    border: 1px solid transparent;
  }
  .ligne.vis { background: rgba(255,255,255,.12); border-color: var(--focus); }
  .ligne .case { width: 30px; font-size: 22px; color: #ffd479; }
  .ligne .nm { flex: 1; font-size: 23px; }
  .ligne .id { color: var(--texte-faible); font-size: 16px; font-family: ui-monospace, Consolas, monospace; }

  /* ---------- message transitoire ---------- */
  #toast {
    position: fixed; left: 50%; bottom: 7vh; z-index: 20;
    transform: translate(-50%, 18px); opacity: 0;
    background: rgba(12,14,20,.94); border: 1px solid rgba(255,255,255,.16);
    padding: 15px 28px; border-radius: 10px; font-size: 21px;
    transition: opacity .25s ease, transform .25s ease;
    max-width: 72vw; text-align: center;
  }
  #toast.vu { opacity: 1; transform: translate(-50%, 0); }
  #indice { position: fixed; right: var(--marge); bottom: 2.2vh; z-index: 5;
            font-size: 16px; color: rgba(255,255,255,.42); letter-spacing: .4px; }
</style>
</head>
<body>

<div id="fonds"></div>
<div id="voile"></div>

<div id="ecran">
  <header>
    <div>
      <div id="heure">--:--</div>
      <div id="date">&nbsp;</div>
    </div>
    <div id="marque">Accueil</div>
  </header>

  <div id="milieu">
    <div class="titre-section">Applications</div>
    <div class="piste">
      <div id="rangee"></div>
    </div>
  </div>

  <div id="zone-dock">
    <div class="titre-section">Favoris</div>
    <div id="dock"></div>
  </div>
</div>

<div id="reglages">
  <h2>Choisir les favoris</h2>
  <p class="aide">Haut / Bas pour parcourir &nbsp;&middot;&nbsp; OK pour ajouter ou retirer du dock &nbsp;&middot;&nbsp; Retour pour fermer</p>
  <div id="liste"><div id="liste-inner"></div></div>
</div>

<div id="toast"></div>
<div id="indice">Haut/Bas : changer de rangee &nbsp;&middot;&nbsp; OK : ouvrir &nbsp;&middot;&nbsp; Retour : quitter</div>

/* ===================================================================

var surTizen = (typeof tizen !== 'undefined' && tizen && tizen.application);

var zone = 'grille';      // 'grille' | 'dock'
var iGrille = 0, iDock = 0, iListe = 0;
var reglagesOuverts = false;
var decorCourant = -1, calqueA, calqueB, calqueActif = 0;

var CLE_FAV = 'accueil.favoris.v1';

function lireFavoris() {
  try {
    var brut = window.localStorage.getItem(CLE_FAV);
    if (brut) return JSON.parse(brut);
  } catch (e) { /* stockage indisponible : on continue sans */ }
  return null;
}
function ecrireFavoris() {
  try { window.localStorage.setItem(CLE_FAV, JSON.stringify(favoris)); }
  catch (e) { /* sans consequence : les favoris ne survivront pas au redemarrage */ }
}

/* ===================================================================
   3. Fonds
   =================================================================== */
function initFonds() {
  var hote = document.getElementById('fonds');
  calqueA = document.createElement('div'); calqueA.className = 'fond';
  calqueB = document.createElement('div'); calqueB.className = 'fond';
  hote.appendChild(calqueA); hote.appendChild(calqueB);
  decorSuivant();
  setInterval(decorSuivant, 45000);
}
function decorSuivant() {
  decorCourant = (decorCourant + 1) % DECORS.length;
  var cible = (calqueActif === 0) ? calqueB : calqueA;
  var sortant = (calqueActif === 0) ? calqueA : calqueB;
  cible.innerHTML = '<div class="kb">' + DECORS[decorCourant] + '</div>';
  cible.classList.add('actif');
  sortant.classList.remove('actif');
  calqueActif = 1 - calqueActif;
}

/* ===================================================================
   4. Horloge  (rafraichie toutes les 15 s : seules les minutes sont
      affichees, inutile de reveiller le CPU chaque seconde)
   =================================================================== */
function majHorloge() {
  var d = new Date();
  var hh = ('0' + d.getHours()).slice(-2);
  var mm = ('0' + d.getMinutes()).slice(-2);
  document.getElementById('heure').textContent = hh + ':' + mm;
  var opts = { weekday: 'long', day: 'numeric', month: 'long' };
  var txt;
  try { txt = d.toLocaleDateString('fr-FR', opts); }
  catch (e) { txt = d.toDateString(); }
  document.getElementById('date').textContent = txt;
}

/* ===================================================================
   5. Chargement des applications
   =================================================================== */
function chargerApps() {
  if (surTizen && typeof tizen.application.getAppsInfo === 'function') {
    try {
      tizen.application.getAppsInfo(function (liste) {
        var vus = [];
        for (var i = 0; i < liste.length; i++) {
          var a = liste[i];
          if (a.show === false) continue;          // applis systeme masquees
          vus.push({ id: a.id, nom: a.name, icone: a.iconPath || null });
        }
        vus.sort(function (x, y) { return x.nom.localeCompare(y.nom, 'fr'); });
        apps = vus.length ? vus : REPLI.map(normRepli);
        apresChargement();
      }, function () {
        apps = REPLI.map(normRepli); apresChargement();
      });
      return;
    } catch (e) { /* API absente malgre la detection */ }
  }
  apps = REPLI.map(normRepli);
  apresChargement();
}
function normRepli(x) { return { id: x.id, nom: x.nom, icone: null }; }

function apresChargement() {
  var sauv = lireFavoris();
  if (sauv && sauv.length) {
    // On ne garde que les favoris encore installes
    favoris = sauv.filter(function (id) { return trouverApp(id) !== null; });
  } else {
    favoris = apps.slice(0, Math.min(5, apps.length)).map(function (a) { return a.id; });
  }
  dessiner();
}
function trouverApp(id) {
  for (var i = 0; i < apps.length; i++) if (apps[i].id === id) return apps[i];
  return null;
}

/* ===================================================================
   6. Rendu
   =================================================================== */
function vignette(a, i, grande) {
  var t = TEINTES[i % TEINTES.length];
  var h = '<div class="fondu" style="background:linear-gradient(145deg,' + t[0] + ',' + t[1] + ')"></div>';
  if (a.icone) {
    h += '<img src="' + a.icone + '" alt="">';
  } else {
    h += '<span class="lettre">' + a.nom.charAt(0).toUpperCase() + '</span>';
  }
  if (grande) {
    if (favoris.indexOf(a.id) !== -1) h += '<span class="etoile">&#9733;</span>';
    h += '<div class="nom">' + a.nom + '</div>';
  }
  return h;
}

function dessiner() {
  var rangee = document.getElementById('rangee');
  rangee.innerHTML = '';
  for (var i = 0; i < apps.length; i++) {
    var d = document.createElement('div');
    d.className = 'tuile';
    d.innerHTML = vignette(apps[i], i, true);
    rangee.appendChild(d);
  }
  // tuile Favoris, toujours en fin de rangee
  var r = document.createElement('div');
  r.className = 'tuile';
  r.innerHTML = '<div class="fondu" style="background:linear-gradient(145deg,#2f3540,#15181e)"></div>' +
                '<span class="lettre">&#9733;</span><div class="nom">Favoris</div>';
  rangee.appendChild(r);

  var dock = document.getElementById('dock');
  dock.innerHTML = '';
  if (!favoris.length) {
    dock.innerHTML = '<div id="dock-vide">Aucun favori &mdash; ouvre la tuile Favoris pour en choisir</div>';
  } else {
    for (var j = 0; j < favoris.length; j++) {
      var af = trouverApp(favoris[j]);
      if (!af) continue;
      var f = document.createElement('div');
      f.className = 'fav';
      f.innerHTML = vignette(af, apps.indexOf(af), false);
      dock.appendChild(f);
    }
  }
  majFocus();
}

function elemsGrille() { return document.querySelectorAll('#rangee .tuile'); }
function elemsDock()   { return document.querySelectorAll('#dock .fav'); }

function majFocus() {
  var g = elemsGrille(), d = elemsDock(), i;
  for (i = 0; i < g.length; i++) g[i].classList.remove('vis');
  for (i = 0; i < d.length; i++) d[i].classList.remove('vis');

  if (zone === 'grille' && g.length) {
    if (iGrille >= g.length) iGrille = g.length - 1;
    g[iGrille].classList.add('vis');
    // defilement : on garde la tuile visee vers le tiers gauche
    var pas = 272 + 22;
    var dec = Math.max(0, (iGrille - 2)) * pas;
    document.getElementById('rangee').style.transform = 'translate3d(' + (-dec) + 'px,0,0)';
  } else if (zone === 'dock' && d.length) {
    if (iDock >= d.length) iDock = d.length - 1;
    d[iDock].classList.add('vis');
  }
}

/* ===================================================================
   7. Lancement
   =================================================================== */
function lancer(id) {
  var a = trouverApp(id);
  var nom = a ? a.nom : id;
  if (surTizen && typeof tizen.application.launch === 'function') {
    try {
      tizen.application.launch(id, function () { /* ok */ },
        function (e) { toast('Impossible d\'ouvrir ' + nom + ' (' + (e && e.name ? e.name : 'erreur') + ')'); });
    } catch (e) { toast('Lancement refuse pour ' + nom); }
  } else {
    toast('Apercu navigateur — sur la TV, ceci ouvrirait ' + nom);
  }
}

var minuteurToast = null;
function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('vu');
  if (minuteurToast) clearTimeout(minuteurToast);
  minuteurToast = setTimeout(function () { t.classList.remove('vu'); }, 3200);
}

/* ===================================================================
   8. Panneau des favoris
   =================================================================== */
function ouvrirReglages() {
  reglagesOuverts = true;
  iListe = 0;
  document.getElementById('reglages').classList.add('ouvert');
  dessinerListe();
}
function fermerReglages() {
  reglagesOuverts = false;
  document.getElementById('reglages').classList.remove('ouvert');
  ecrireFavoris();
  dessiner();
}
function dessinerListe() {
  var h = '';
  for (var i = 0; i < apps.length; i++) {
    var a = apps[i];
    var coche = (favoris.indexOf(a.id) !== -1);
    h += '<div class="ligne' + (i === iListe ? ' vis' : '') + '">' +
         '<span class="case">' + (coche ? '&#9733;' : '&#9734;') + '</span>' +
         '<span class="nm">' + a.nom + '</span>' +
         '<span class="id">' + a.id + '</span></div>';
  }
  var inner = document.getElementById('liste-inner');
  inner.innerHTML = h;
  var hauteurLigne = 66;
  var visibles = Math.floor(document.getElementById('liste').clientHeight / hauteurLigne);
  var dec = Math.max(0, iListe - visibles + 2) * hauteurLigne;
  inner.style.transform = 'translate3d(0,' + (-dec) + 'px,0)';
}
function basculerFavori() {
  var a = apps[iListe];
  if (!a) return;
  var p = favoris.indexOf(a.id);
  if (p === -1) {
    if (favoris.length >= 8) { toast('Le dock est plein (8 maximum)'); return; }
    favoris.push(a.id);
  } else {
    favoris.splice(p, 1);
  }
  dessinerListe();
}

/* ===================================================================
   9. Telecommande
      Tizen : Retour = 10009, Quitter = 10182. On garde aussi
      Backspace/Echap pour l'apercu au navigateur.
   =================================================================== */
function surTouche(ev) {
  var k = ev.keyCode;

  if (reglagesOuverts) {
    if (k === 38) { iListe = Math.max(0, iListe - 1); dessinerListe(); }
    else if (k === 40) { iListe = Math.min(apps.length - 1, iListe + 1); dessinerListe(); }
    else if (k === 13) { basculerFavori(); }
    else if (k === 10009 || k === 8 || k === 27) { fermerReglages(); }
    else return;
    ev.preventDefault();
    return;
  }

  if (k === 37) {                                   // gauche
    if (zone === 'grille') iGrille = Math.max(0, iGrille - 1);
    else iDock = Math.max(0, iDock - 1);
  } else if (k === 39) {                            // droite
    if (zone === 'grille') iGrille = Math.min(elemsGrille().length - 1, iGrille + 1);
    else iDock = Math.min(elemsDock().length - 1, iDock + 1);
  } else if (k === 40) {                            // bas
    if (zone === 'grille' && elemsDock().length) zone = 'dock';
  } else if (k === 38) {                            // haut
    if (zone === 'dock') zone = 'grille';
  } else if (k === 13) {                            // OK
    if (zone === 'grille') {
      if (iGrille === apps.length) ouvrirReglages();   // derniere tuile
      else lancer(apps[iGrille].id);
    } else {
      var a = trouverApp(favoris[iDock]);
      if (a) lancer(a.id);
    }
    ev.preventDefault();
    return;
  } else if (k === 10009 || k === 8 || k === 27) {  // Retour
    if (zone === 'dock') { zone = 'grille'; }
    else if (surTizen && tizen.application) {
      try { tizen.application.getCurrentApplication().exit(); } catch (e) {}
    }
  } else {
    return;
  }

  majFocus();
  ev.preventDefault();
}

/* ===================================================================
   10. Demarrage
   =================================================================== */
function demarrer() {
  initFonds();
  majHorloge();
  setInterval(majHorloge, 15000);
  chargerApps();
  document.addEventListener('keydown', surTouche, false);

  // Enregistre les touches media aupres de Tizen, si disponible
  if (typeof tizen !== 'undefined' && tizen.tvinputdevice) {
    var voulues = ['MediaPlayPause', 'MediaPlay', 'MediaPause', 'MediaStop'];
    for (var i = 0; i < voulues.length; i++) {
      try { tizen.tvinputdevice.registerKey(voulues[i]); } catch (e) {}
    }
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', demarrer);
} else {
  demarrer();
}
</script>
